name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - name: Fix files with base64
        run: |
          echo "Fixing pubspec.yaml..."
          cat > pubspec.yaml << 'YAML_EOF'
          name: ai_smart_phone
          description: AI Self-Evolving Phone System
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            local_auth: ^2.1.7
            flutter_tts: 4.0.2
            speech_to_text: ^6.6.0
            http: ^1.1.0
            shared_preferences: ^2.2.2
            permission_handler: ^11.3.1
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0
          flutter:
            uses-material-design: true
          YAML_EOF

