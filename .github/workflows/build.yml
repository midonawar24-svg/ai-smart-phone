name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - name: Build APK
        run: |
          cp lib/main.dart /tmp/main.dart
          cp pubspec.yaml /tmp/pubspec.yaml
          rm -rf android
          flutter create --platforms=android --project-name ai_smart_phone --org com.mido.ai --overwrite .
          cp /tmp/pubspec.yaml ./pubspec.yaml
          cp /tmp/main.dart ./lib/main.dart
          echo "=== Fixing pubspec to use stable tts ==="
          sed -i 's/flutter_tts:.*/flutter_tts: 4.0.2/' pubspec.yaml
          cat pubspec.yaml
          echo "=== Fixing Kotlin to 2.1.10 ==="
          cat android/settings.gradle
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.1.10"/' android/settings.gradle
          sed -i "s/id 'org.jetbrains.kotlin.android' version '[^']*'/id 'org.jetbrains.kotlin.android' version '2.1.10'/" android/settings.gradle
          sed -i 's/org.jetbrains.kotlin.android" version "[^"]*"/org.jetbrains.kotlin.android" version "2.1.10" apply false/' android/settings.gradle || true
          cat android/settings.gradle
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
