name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - name: Fix Gradle and Build
        run: |
          # 1. Save your fixed main.dart
          cp lib/main.dart /tmp/m.dart
          # 2. Delete old android folder completely
          rm -rf android
          rm -rf .dart_tool
          # 3. Create new android project (fixes Gradle error)
          flutter create --platforms=android --project-name ai_smart_phone --org com.mido.ai . --overwrite
          # 4. Restore your fixed main.dart
          cp /tmp/m.dart lib/main.dart
          # 5. Write correct pubspec.yaml
          cat > pubspec.yaml << 'EOF'
          name: ai_smart_phone
          description: AI Self System Final Fixed
          publish_to: 'none'
          version: 1.0.0+40
          environment:
            sdk: ">=3.0.0 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
            local_auth: 2.1.7
            flutter_tts: 4.2.3
            speech_to_text: 6.6.2
            http: 1.2.2
            shared_preferences: 2.3.2
            permission_handler: 11.3.1
          flutter:
            uses-material-design: true
          EOF
          # 6. Fix kotlin version
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.1.10"/' android/settings.gradle || true
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          
