name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - name: Fix and Build
        run: |
          rm -rf android .dart_tool
          flutter create --platforms=android --project-name ai_smart_phone --org com.mido.ai . --overwrite
          git checkout HEAD -- lib/main.dart || true
          flutter pub add local_auth flutter_tts speech_to_text http shared_preferences permission_handler
          sed -i 's/kotlin.*2.1.10/kotlin" version "2.1.10"/' android/settings.gradle || true
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.1.10"/' android/settings.gradle || true
          python3 <<PY
          import pathlib
          p=pathlib.Path('android/app/src/main/AndroidManifest.xml')
          t=p.read_text()
          if 'android.permission.INTERNET' not in t:
              t=t.replace('<application','<uses-permission android:name="android.permission.INTERNET" /><application')
              p.write_text(t)
              print('added internet')
          PY
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-WITH-INTERNET
          path: build/app/outputs/flutter-apk/app-release.apk
          
