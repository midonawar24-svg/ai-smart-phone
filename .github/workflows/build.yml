name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - name: Fix Gradle + Internet + Build
        run: |
          echo "Saving main.dart..."
          cp lib/main.dart /tmp/m.dart || echo "no lib/main.dart, will use embedded"
          rm -rf android .dart_tool
          flutter create --platforms=android --project-name ai_smart_phone --org com.mido.ai . --overwrite
          if [ -f /tmp/m.dart ]; then cp /tmp/m.dart lib/main.dart; fi
          cat > pubspec.yaml << 'YAML'
          name: ai_smart_phone
          description: AI Self System Final Fixed
          publish_to: 'none'
          version: 1.0.0+41
          environment:
            sdk: ">=3.0.0 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
            local_auth: 2.1.7
            flutter_tts: 4.2.3
            speech_to_text: 6.6.2
            http: 1.2.2
            shared_preferences: 2.3.2
            permission_handler: 11.3.1
          flutter:
            uses-material-design: true
          YAML
          # Fix kotlin
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.1.10"/' android/settings.gradle || true
          # ADD INTERNET PERMISSION - THE CRITICAL FIX
          echo "Adding INTERNET permission..."
          grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml || sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          cat android/app/src/main/AndroidManifest.xml | grep -A2 -B2 INTERNET || echo "check manifest"
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-with-internet
          path: build/app/outputs/flutter-apk/app-release.apk
